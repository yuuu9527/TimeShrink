name: Build TimeShrink

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

env:
  THEOS: ${{ github.workspace }}/theos-roothide
  THEOS_IGNORE_PARALLEL_BUILDING_NOTICE: yes

jobs:
  build:
    name: Build (${{ matrix.build_variant }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - build_variant: roothide
          # - build_variant: rootless
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          set -euo pipefail
          available() { apt-cache policy "$1" 2>/dev/null | grep -q 'Candidate: [^(]'; }
          sudo apt-get update
          PKGS="build-essential fakeroot rsync curl perl zip git xz-utils libplist-utils dpkg wget"
          for p in libxml2 libxml2-16 libncurses6 libtinfo6 libz3-dev binutils-gold; do
            if available "$p"; then PKGS="$PKGS $p"; fi
          done
          sudo apt-get install -y $PKGS
          sudo wget -q -O /usr/local/bin/ldid \
            https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus7/ldid_linux_x86_64
          sudo chmod +x /usr/local/bin/ldid

      - name: Checkout Theos (RootHide)
        uses: actions/checkout@v4
        with:
          repository: roothide/theos
          path: theos-roothide
          submodules: recursive

      - name: Install Linux toolchain
        run: |
          set -euo pipefail
          if [ -d "$THEOS/toolchain/linux" ]; then
            echo "toolchain already present"
            exit 0
          fi
          mkdir -p "$THEOS/toolchain"
          wget -q https://github.com/kabiroberai/swift-toolchain-linux/releases/download/v2.3.0/swift-5.8-ubuntu22.04.tar.xz -O /tmp/tc.tar.xz
          tar -xf /tmp/tc.tar.xz -C "$THEOS/toolchain"
          ls -1 "$THEOS/toolchain"

      - name: Install iOS SDK
        run: |
          set -euo pipefail
          mkdir -p "$THEOS/sdks"
          if [ -d "$THEOS/sdks/iPhoneOS16.5.sdk" ]; then
            echo "SDK already present"
            exit 0
          fi
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git /tmp/sdks
          git -C /tmp/sdks sparse-checkout set iPhoneOS16.5.sdk
          cp -R /tmp/sdks/iPhoneOS16.5.sdk "$THEOS/sdks/"

      - name: Setup Environment
        run: |
          echo "$THEOS/bin" >> "$GITHUB_PATH"
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"

      - name: Bump Package Version
        id: bump
        run: |
          VERSION="5.2.0-${GITHUB_RUN_NUMBER}"
          echo "Using version: $VERSION"
          sed -i "s/^Version: .*/Version: ${VERSION}/" control
          echo "package_version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build Package
        run: |
          set -euo pipefail
          echo "THEOS=$THEOS"
          sh build.sh "${{ matrix.build_variant }}"
          echo "=== .deb files ==="
          find ./packages -name "*.deb" -type f

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.build_variant }}
          path: ./packages/*.deb
          if-no-files-found: error

      - name: Create Release
        if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ github.token }}
          tag_name: v${{ steps.bump.outputs.package_version }}
          name: "时间收缩 v${{ steps.bump.outputs.package_version }}"
          files: ./packages/*.deb
